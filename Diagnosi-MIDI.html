<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloomy · Diagnosi MIDI</title><style>body{background:#071725;color:#def3ff;font:18px/1.5 system-ui;max-width:800px;margin:30px auto;padding:20px}button{font:inherit;padding:14px;background:#80d6ff;border:0;border-radius:8px}pre{white-space:pre-wrap}</style><h1>Diagnosi USB MIDI</h1><p>Questa pagina elenca le porte MIDI. Non invia messaggi al dispositivo e non installa firmware.</p><button id="check">Mostra porte MIDI</button><pre id="result"></pre><script>
const result=document.getElementById('result');result.textContent='Contesto sicuro: '+isSecureContext+'\nWeb MIDI disponibile: '+(typeof navigator.requestMIDIAccess==='function');
document.getElementById('check').onclick=async()=>{try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI non disponibile in questo contesto');const a=await navigator.requestMIDIAccess({sysex:true});const show=()=>{result.textContent='SysEx: '+a.sysexEnabled+'\nINGRESSI:\n'+([...a.inputs.values()].map(p=>p.name+' | '+p.manufacturer+' | '+p.state).join('\n')||'(nessuno)')+'\nUSCITE:\n'+([...a.outputs.values()].map(p=>p.name+' | '+p.manufacturer+' | '+p.state).join('\n')||'(nessuna)')};show();a.onstatechange=show;}catch(e){result.textContent+='\nErrore: '+e.name+': '+e.message;}};
</script></html>
